[project]
name = "opportunity-platform"
version = "0.1.0"
description = "Autonomous opportunity discovery and human-in-the-loop application platform (backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "structlog>=24.4",
    "redis>=5.2",
    "arq>=0.26",
    "pypdf>=5.1",
    "python-multipart>=0.0.20",
    "playwright>=1.48",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
]

[project.scripts]
serve = "app.serve:main"
worker = "app.main_worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "fakeredis>=2.26",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "N"]
# ASYNC109: `timeout` on IEventSubscription.get is a poll interval, not a cancellation scope.
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT018", "E501"]
"alembic/**" = ["N999", "E501"]
# Embedded browser JavaScript is kept readable on long lines.
"src/app/infrastructure/browser/form_filler.py" = ["E501"]
"src/app/infrastructure/browser/teach_recorder.py" = ["E501"]
"src/app/infrastructure/linkedin/authenticated_adapter.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie",
    "fastapi.File", "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgserver.*", "fakeredis.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:pgserver.*"]

[tool.coverage.run]
source = ["src/app"]
omit = ["src/app/serve.py", "src/app/main_worker.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "app.main_worker | app.serve",
    "app.bootstrap",
    "app.api | app.infrastructure",
    "app.application",
    "app.domain",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain and application are framework-free"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "pydantic", "pydantic_settings", "httpx", "openai",
    "redis", "arq", "cryptography", "structlog", "jwt", "argon2", "asyncpg", "alembic", "uvicorn",
]
